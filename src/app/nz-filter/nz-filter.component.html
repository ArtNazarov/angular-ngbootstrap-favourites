<!-- nz-filter.component.html -->
<div class="filter-container">
  <input 
    type="text" 
    [(ngModel)]="filterText" 
    (ngModelChange)="onInputChange()"
    (keyup.enter)="onFilter()"
    [placeholder]="placeholder"
    class="filter-input"
  />
  <button (click)="onFilter()" class="filter-button">Фильтр</button>
  
  @if (filterText) {
    <button (click)="clearFilter()" class="clear-button">×</button>
  }
</div>
